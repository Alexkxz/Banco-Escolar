; Isolated ota_0 installer build. No upload is defined or invoked by this task.
[platformio]
build_dir = C:/Users/alexk/Documents/Banco-Escolar-Tools/ota-dev9-installer-build
libdeps_dir = C:/Users/alexk/Documents/PlatformIO/Projects/Banco-Escolar/.pio/libdeps

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I C:/Users/alexk/Documents/PlatformIO/Projects/Banco-Escolar/lib
    -I C:/Users/alexk/Documents/PlatformIO/Projects/Banco-Escolar/src
    -include C:/Users/alexk/Documents/PlatformIO/Projects/Banco-Escolar/tools/ota/lab/ota_lab_test_public_key.h
    -DBANCO_OTA_ENABLED=0
    -DBANCO_OTA_LAB_BUILD=0
    -DBANCO_OTA_LAB_INSTALLER_BUILD=1

lib_deps =
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit BusIO@1.17.4
    bblanchon/ArduinoJson@^6.21.5
